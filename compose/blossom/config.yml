# Blossom Server Configuration for RoboSats

publicDomain: ""

database:
  path: data/sqlite.db

dashboard:
  enabled: false
  username: "admin"

# Storage config
storage:
  backend: "local"
  removeWhenNoOwners: false
  local:
    dir: "./data/blobs"

  # keep encrypted images for 30 days
  rules:
    - type: "application/octet-stream" # no recognizable type
      expiration: "30 days"
    - type: "*"
      expiration: "30 days"

# (BUD-02) upload
upload:
  enabled: true
  requireAuth: true # BUD-01/02 Nostr auth
  requirePubkeyInRule: false
  maxSize: 10485760 # 10 MB

# No need for media optimization (BUD-05)
media:
  enabled: false
  requireAuth: true

# (BUD-04) list — disabled for privacy
list:
  enabled: false
  requireAuth: true
  allowListOthers: false
